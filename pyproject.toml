[project]
name = "cheat-engine-table-manager"
version = "0.6.2"
description = "Pipeline-style manager and loader for Cheat Engine .ct tables"
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cetm maintainers" }]
keywords = ["cheat-engine", "cheat-table", "ct", "memory", "reverse-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Utilities",
]
dependencies = [
  "pymem>=1.12.0",
  "lxml>=5.2.1",
  "click>=8.1.7",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-cov>=5.0.0", "ruff>=0.4.0", "mypy>=1.10.0"]
sigscan = ["capstone>=5.0.1"]

[project.scripts]
cetm = "cetm.bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cetm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"